name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Firestore emulator is a Java process; without a JDK on PATH
      # `firebase emulators:exec` fails before any test runs.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # npm test shells out to `firebase emulators:exec`, and firebase-tools is
      # not a project dependency. Pinned to the major version used locally.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      # Cache the emulator jar so every run does not re-download it.
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test against the Firestore emulator
        run: npm test
