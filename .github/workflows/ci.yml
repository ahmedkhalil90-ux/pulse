name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions minutes are limited on the free plan. The full suite (tests and
# bots, ~15 min) runs on pull requests; a push to main is a merge of a PR that
# already passed, so it only type-checks, builds and deploys. Code changes go
# through pull requests.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Firestore emulator is a Java process; without a JDK on PATH
      # `firebase emulators:exec` fails before any test runs.
      - name: Set up Java
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # npm test shells out to `firebase emulators:exec`, and firebase-tools is
      # not a project dependency. Pinned to the major version used locally.
      - name: Install firebase-tools
        if: github.event_name == 'pull_request'
        run: npm install -g firebase-tools@15

      # Cache the emulator jar so every run does not re-download it.
      - name: Cache Firestore emulator
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test against the Firestore emulator
        if: github.event_name == 'pull_request'
        run: npm test

      # Player, swarm and attacker bots: real browsers and concurrent users
      # against the emulators. Screenshots of any failed step are uploaded.
      - name: Install Chromium for the player bots
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run the bots
        if: github.event_name == 'pull_request'
        run: npm run bots

      - name: Upload bot report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bot-report
          path: |
            bots/e2e/out/
            bots/out-vitest.log
          if-no-files-found: ignore

  # Publish the web app when main is green: tests and bots must pass first.
  # Approved by Ahmed on 2026-10-28. Rules are not deployed here.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-hosting, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish to Firebase Hosting
        env: { KEY: '${{ secrets.FIREBASE_SA_KEY }}' }
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node scripts/deploy-api.mjs hosting
          rm -f "$RUNNER_TEMP/sa.json"
